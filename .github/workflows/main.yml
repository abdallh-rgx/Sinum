name: Build Sinum Android NDK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Build libsinum.so
        run: |
          cd Android
          $ANDROID_NDK_ROOT/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk NDK_APPLICATION_MK=Application.mk TARGET_ABI=arm64-v8a -j$(nproc)

      - name: Upload shared library
        uses: actions/upload-artifact@v4
        with:
          name: libsinum-so
          path: Android/libs/arm64-v8a/libsinum.so
